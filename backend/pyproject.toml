[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "test-workbench-backend"
version = "0.1.0"
description = "Local API foundation for Test Workbench"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "keyring>=25,<26",
  "paramiko>=3.5,<4",
  "pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "playwright>=1.55,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
